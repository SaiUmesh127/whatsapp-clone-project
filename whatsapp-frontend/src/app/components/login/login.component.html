<div class="login-container">
  <div class="login-box">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="60" height="60">
        <!-- SVG Path Here -->
      </svg>
      <h1>WhatsApp Clone</h1>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <h2>Sign in to continue</h2>

      <div class="error-message" *ngIf="errorMessage">
        <span>⚠️ {{ errorMessage }}</span>
      </div>

      <input type="text" [(ngModel)]="loginData.username" name="username" placeholder="Username" required [disabled]="loading">
      <input type="password" [(ngModel)]="loginData.password" name="password" placeholder="Password" required [disabled]="loading">

      <button type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Sign In' }}</button>

      <p>Don't have an account? <a (click)="goToRegister()">Register here</a></p>
    </form>
  </div>
</div>
