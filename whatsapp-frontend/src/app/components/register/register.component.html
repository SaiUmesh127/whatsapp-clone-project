<div class="register-container">
  <h2>Register</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Username *</label>
      <input type="text" formControlName="username" placeholder="Enter username" />
      <small *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
        Username is required
      </small>
    </div>

    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" formControlName="fullName" placeholder="Enter your full name" />
      <small *ngIf="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched">
        Full name is required
      </small>
    </div>

    <div class="form-group">
      <label>Email *</label>
      <input type="email" formControlName="email" placeholder="Enter your email" />
      <small *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
        Enter a valid email
      </small>
    </div>

    <div class="form-group">
      <label>Password *</label>
      <input type="password" formControlName="password" placeholder="Enter password" />
      <small *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
        Password must be at least 6 characters
      </small>
    </div>

    <div class="form-group">
      <label>Phone Number (optional)</label>
      <input type="text" formControlName="phoneNumber" placeholder="Enter phone number" />
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Register</button>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

    <p class="redirect">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </form>
</div>
