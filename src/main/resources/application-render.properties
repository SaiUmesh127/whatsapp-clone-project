# ==============================================
# LOGGING
# ==============================================
logging.level.root=INFO
logging.level.com.accenture.whatsapp=INFO
logging.level.org.springframework=INFO

# ==============================================
# SERVER CONFIGURATION
# ==============================================
server.compression.enabled=true
server.http2.enabled=true